# ===============================
#   JSON WEB TOKEN
# ===============================
jwt.accessTokenCookieName = accessToken
jwt.refreshTokenCookieName = refreshToken

# ===============================
#   DATA SOURCE - H2 IN-MEMORY DATABASE FOR TESTING
# ===============================
spring.datasource.url = jdbc:h2:mem:db-grade-test
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =

# ===============================
#   JPA / HIBERNATE
# ===============================
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect
spring.h2.console.enabled = true

# ===============================
#   SWAGGER UI / SPRING FOX
# ===============================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===============================
#   TESTING
# ===============================
junit.jupiter.execution.parallel = true
ip = localhost

# ===============================
#   KAFKA - EMBEDDED FOR TESTING
# ===============================
spring.kafka.bootstrap-servers = ${spring.embedded.kafka.brokers}
