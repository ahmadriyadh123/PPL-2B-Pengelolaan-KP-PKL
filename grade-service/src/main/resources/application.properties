# ===============================
#   JSON WEB TOKEN
# ===============================
jwt.accessTokenCookieName=accessToken
jwt.refreshTokenCookieName=refreshToken
jwt.secret=${JWT_SECRET:}

# ===============================
#   AUTH COMMONS (S3-T06)
# ===============================
# grade-service tidak punya public bypass khusus selain docs & health
auth.public-paths=/v2/api-docs,/actuator/health
auth.local-validation.enabled=${AUTH_LOCAL_VALIDATION_ENABLED:false}

# ===============================
#   DATA SOURCE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/db-grade
spring.datasource.username=root
spring.datasource.password=

# ===============================
#   JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
#   SWAGGER UI / SPRING FOX
# ===============================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===============================
#   TESTING
# ===============================
junit.jupiter.execution.parallel=true
ip=localhost