# ===============================
#   JSON WEB TOKEN
# ===============================
jwt.accessTokenCookieName=accessToken
jwt.refreshTokenCookieName=refreshToken
# Secret sama dengan account-service — wajib di-set via env var JWT_SECRET
jwt.secret=${JWT_SECRET:}

# ===============================
#   DATA SOURCE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/db-management-content}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===============================
#   JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
#   SWAGGER UI / SPRING FOX
# ===============================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ===============================
#   AUTH-COMMONS CONFIG (S3-T04)
# ===============================
# Path publik yang dilewati StatelessJwtAuthenticationFilter (shouldNotFilter)
auth.public-paths=/v2/api-docs,/form-submit-time/**,/actuator/health
# Flag validasi lokal — default false sampai seluruh service siap (S3-T08)
auth.local-validation.enabled=${AUTH_LOCAL_VALIDATION_ENABLED:false}
