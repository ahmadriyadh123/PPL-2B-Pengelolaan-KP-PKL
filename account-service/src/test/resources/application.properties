# ===============================
#   JSON WEB TOKEN (test only)
# ===============================
# Secret dummy khusus untuk test; tidak boleh dipakai di environment lain.
jwt.secret = test-secret-do-not-use-in-production-test-secret-do-not-use-in-prod
jwt.tokenExpirationMsec = 900000
jwt.refreshTokenExpirationMsec = 604800000
jwt.accessTokenCookieName = accessToken
jwt.refreshTokenCookieName = refreshToken

# ===============================
#   DATA SOURCE
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
#   JPA / HIBERNATE
# ===============================
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update

# ===============================
#   SWAGGER UI / SPRING FOX
# ===============================
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

# ===============================
#   TESTING
# ===============================
junit.jupiter.execution.parallel = true
ip=localhost